apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agent
    spec:
      template:
        spec:
          containers:
            - name: agent
              image: agent:1.2.0
              env:
                - name: DB_PASSWORD
                  value: "Zq8#mL2vT9xP4Rt"
              securityContext:
                allowPrivilegeEscalation: true
                capabilities:
                  add: ["SYS_ADMIN"]
              volumeMounts:
                - name: sock
                  mountPath: /var/run/docker.sock
          volumes:
            - name: sock
              hostPath:
                path: /var/run/docker.sock
  - apiVersion: v1
    kind: Service
    metadata:
      name: agent
    spec:
      ports:
        - port: 80
